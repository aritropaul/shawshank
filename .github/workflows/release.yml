name: release

# Push a tag like v1.2.3 to build the CLI for every platform and publish a
# release. The release notes come from the annotated tag's message.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          set -eu
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}
            out=build/$os-$arch; mkdir -p "$out"
            bin=tunnel; [ "$os" = windows ] && bin=tunnel.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" -o "$out/$bin" .
            if [ "$os" = windows ]; then
              (cd "$out" && zip -q "$GITHUB_WORKSPACE/dist/tunnel-$os-$arch.zip" "$bin")
            else
              tar -C "$out" -czf "dist/tunnel-$os-$arch.tar.gz" "$bin"
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-from-tag --verify-tag
